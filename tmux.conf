# 最低按 tmux 3.2+ 编写（terminal-features / extended-keys）
# 3.6+ / 3.8+ 特性见文末 %if 分流到独立文件

# ---------- 前缀 ----------
set -g prefix C-a
unbind C-b
bind C-a send-prefix
# 可选第二前缀（v1.6+）：set -g prefix2 `

# ---------- 终端能力 ----------
set -g default-terminal "tmux-256color"
# 真彩 / 焦点 / 扩展键：用 terminal-features（优先于 terminal-overrides）
set -as terminal-features 'xterm*:RGB:focus:extkeys'
set -as terminal-features 'alacritty*:RGB:focus:extkeys'
set -as terminal-features 'tmux*:RGB'
# 扩展键：on 即可；格式保持默认 xterm，兼容面比全局 csi-u 更广
set -g extended-keys on
# 需要 CSI u 的终端可自行打开：set -s extended-keys-format csi-u

# ---------- 通用行为 ----------
set -g mouse on
set -g focus-events on
set -g history-limit 50000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
# 较短等待，配合扩展键/Alt 组合更顺手（3.5a+ 默认已是 10）
set -s escape-time 10

# ---------- 分屏 / 新建：继承当前路径（需要时再打开）----------
# bind | split-window -h -c "#{pane_current_path}"
# bind - split-window -v -c "#{pane_current_path}"
# bind c new-window -c "#{pane_current_path}"

# ---------- 窗格切换（prefix + hjkl）----------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---------- 复制模式（vi）----------
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# set-clipboard external（默认）走 OSC 52；多数现代终端可用

# ---------- 状态栏 ----------
set -g status-justify left
set -g status-interval 10
setw -g monitor-activity on
set -g visual-activity off
set -g status-style "bg=blue,fg=black"
set -g message-style "bg=#202529,fg=#91A8BA"
set -wg window-status-separator "|"
set -wg window-status-style "bg=#848884,fg=black"
set -wg window-status-current-style "bg=green,fg=black"
set -wg window-status-activity-style "bg=#848884,fg=black,bold"
set -g status-right "#{?client_prefix,#[bg=#FFA500] [PREFIX] #[default],}#{?pane_in_mode,#[bg=#FFD580] [COPY] #[default],} %H:%M %y-%m-%d"

# ---------- 按版本加载特性（tmux 3.0+ 的 %if / #{version}）----------
# 文件需链接到 $HOME：~/.tmux-3.6.conf、~/.tmux-3.8.conf
%if #{>=:#{version},3.6}
if-shell '[ -f "$HOME/.tmux-3.6.conf" ]' 'source-file "$HOME/.tmux-3.6.conf"'
%endif
%if #{>=:#{version},3.8}
if-shell '[ -f "$HOME/.tmux-3.8.conf" ]' 'source-file "$HOME/.tmux-3.8.conf"'
%endif
