# tmux 3.8+：在 3.6 配置之上覆盖/补充

# 滚动条 auto-hide：滚动或悬停时出现，超时隐藏，不再长期挤窄 pane
# （modal 在 3.8 仍可用；这里优先新行为）
set -g pane-scrollbars auto-hide
# set -g pane-scrollbars-timeout 1000

# 内置 light/dark theme 会改默认配色；保持 terminal 以免冲掉主配置里的自定义 status
set -s theme terminal

# mouse 在 3.8 默认已是 on；主配置已显式开启，此处不重复
# 可选：模糊切换窗口/会话（默认 Prefix+Tab / Prefix+BTab → switch-mode）
# 若自行绑定了 Tab，注意不要覆盖该能力
